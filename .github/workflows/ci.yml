name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The tests need no sign-in or network. Without remote calls the CLI also
      # keeps its mods switch at the default (on), so the tests always run.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The oldest Claude Code md-render supports; raise it with the README.
      - run: npm install --global @anthropic-ai/claude-code@2.1.287
      # At the root, validate reads the marketplace; the plugin's own manifest
      # and hooks module are validated through plugin.json.
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict .claude-plugin/plugin.json
      - run: claude plugin test .
